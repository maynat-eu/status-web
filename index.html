<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>MAYNAT · Status</title>

    <!-- ICOANE -->
    <link rel="icon" type="image/png" href="https://maynat.ct.ws/images/logo.png" />
    <link rel="shortcut icon" href="https://maynat.ct.ws/images/logo.png" />
    <link rel="apple-touch-icon" href="https://maynat.ct.ws/images/logo.png" />

    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ============================================================
           TOKENS — abis albastru + sticlă lichidă (același ca pe main)
           ============================================================ */
        :root {
            --deep: #040f1f;
            --deep-2: #071e38;
            --mid: #0c2f52;
            --ice: #8fe9ff;
            --sky: #4fb3ff;
            --core: #1a6fd6;
            --gold: #ffd27a;
            --ink: #eef7ff;
            --ink-dim: #a9c6df;
            --ink-mute: #6f90ab;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-2: rgba(255, 255, 255, 0.10);
            --glass-border: rgba(180, 220, 255, 0.22);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-pixel: 'Press Start 2P', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--deep);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.55;
            overflow-x: hidden;
            min-height: 100vh;
            padding: 20px 20px 80px;
            display: flex;
            justify-content: center;
        }

        ::-webkit-scrollbar {
            width: 10px;
            background: var(--deep);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--core);
            border-radius: 10px;
        }

        /* ============================================================
           BACKDROP — abis + valuri aurorale
           ============================================================ */
        .abyss {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at 15% 8%, rgba(79, 179, 255, 0.16), transparent 42%),
                radial-gradient(circle at 85% 78%, rgba(26, 111, 214, 0.20), transparent 46%),
                linear-gradient(190deg, var(--deep-2) 0%, var(--deep) 55%, #020a15 100%);
        }
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
            opacity: .55;
            animation: drift 22s ease-in-out infinite;
        }
        .blob.b1 {
            width: 480px;
            height: 480px;
            top: -140px;
            left: -120px;
            background: radial-gradient(circle, var(--core), transparent 70%);
            animation-duration: 26s;
        }
        .blob.b2 {
            width: 420px;
            height: 420px;
            bottom: -160px;
            right: -100px;
            background: radial-gradient(circle, var(--sky), transparent 70%);
            animation-duration: 19s;
            animation-delay: -6s;
        }
        .blob.b3 {
            width: 300px;
            height: 300px;
            top: 38%;
            right: 12%;
            background: radial-gradient(circle, var(--ice), transparent 70%);
            opacity: .28;
            animation-duration: 24s;
            animation-delay: -11s;
        }
        @keyframes drift {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(40px, -30px) scale(1.08);
            }
            66% {
                transform: translate(-30px, 25px) scale(0.95);
            }
        }

        /* Bubbles */
        .bubbles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .bubble {
            position: absolute;
            bottom: -40px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.5), rgba(143, 233, 255, 0.05) 70%);
            border: 1px solid rgba(180, 225, 255, 0.25);
            animation: rise linear infinite;
        }
        @keyframes rise {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: .7;
            }
            90% {
                opacity: .5;
            }
            100% {
                transform: translateY(-110vh) translateX(20px);
                opacity: 0;
            }
        }

        /* ============================================================
           LIQUID GLASS — panoul de bază
           ============================================================ */
        .glass {
            position: relative;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.25),
                inset 0 -12px 24px -18px rgba(0, 0, 0, 0.5),
                0 18px 40px -18px rgba(0, 10, 25, 0.65);
            overflow: hidden;
        }
        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.16) 0%, transparent 30%);
            mix-blend-mode: screen;
        }
        .glass::after {
            content: "";
            position: absolute;
            top: -40%;
            left: -20%;
            width: 60%;
            height: 180%;
            background: linear-gradient(75deg, transparent 30%, rgba(255, 255, 255, 0.16) 46%, rgba(255, 255, 255, 0.02) 52%, transparent 70%);
            transform: rotate(8deg);
            animation: sheen 7s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes sheen {
            0%,
            100% {
                left: -30%;
            }
            50% {
                left: 120%;
            }
        }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .container {
            position: relative;
            z-index: 10;
            max-width: 980px;
            width: 100%;
        }

        /* ============================================================
           NAV
           ============================================================ */
        .dock {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            margin-bottom: 26px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .brand .slot {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(155deg, rgba(143, 233, 255, 0.35), rgba(26, 111, 214, 0.35));
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            color: var(--ice);
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4);
        }
        .brand .txt {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }
        .brand .txt .name {
            font-family: var(--font-pixel);
            font-size: .72rem;
            color: var(--ink);
            letter-spacing: 1px;
        }
        .brand .txt .sub {
            font-size: .72rem;
            color: var(--ink-mute);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 3px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--ink-dim);
            text-decoration: none;
            font-size: .92rem;
            font-weight: 500;
            padding: 9px 16px;
            border-radius: 999px;
            transition: .2s;
        }
        .nav-links a:hover {
            background: var(--glass-2);
            color: var(--ink);
        }
        .nav-links a.primary {
            background: linear-gradient(135deg, var(--sky), var(--core));
            color: #04162c;
            font-weight: 700;
            box-shadow: 0 6px 18px -6px rgba(79, 179, 255, 0.55), inset 0 1px 0 rgba(255, 255, 255, .5);
        }
        .nav-links a.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 22px -6px rgba(79, 179, 255, 0.7), inset 0 1px 0 rgba(255, 255, 255, .5);
        }
        .nav-links a.primary i {
            margin-right: 6px;
        }

        /* ============================================================
           HERO TITLE
           ============================================================ */
        .page-title {
            text-align: center;
            margin: 10px 0 30px;
        }
        .page-title h1 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 2.8rem;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #ffffff, var(--ink-dim) 140%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .page-title h1 .accent {
            background: linear-gradient(120deg, var(--ice), var(--sky));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .page-title p {
            color: var(--ink-mute);
            font-size: 1.05rem;
            margin-top: 8px;
        }

        /* ============================================================
           QUICK LINKS — carduri cu sticlă
           ============================================================ */
        .quick-links {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 40px;
        }
        .quick-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 22px 12px 18px;
            text-decoration: none;
            color: var(--ink);
            border-radius: 20px;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            text-align: center;
            min-height: 110px;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
        }
        .quick-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--sky);
            box-shadow: 0 12px 32px -12px rgba(79, 179, 255, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .quick-card .icon {
            font-size: 2.2rem;
            margin-bottom: 6px;
            line-height: 1;
        }
        .quick-card .label {
            font-size: 0.85rem;
            opacity: 0.8;
            font-weight: 500;
        }
        .quick-card .sub-label {
            font-size: 0.7rem;
            opacity: 0.5;
            margin-top: 2px;
        }

        /* ============================================================
           GROUP TITLE
           ============================================================ */
        .group-title {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 34px 0 16px;
        }
        .group-title .tag {
            border-radius: 999px;
            padding: 6px 14px;
            font-family: var(--font-pixel);
            font-size: .58rem;
            color: var(--ice);
            white-space: nowrap;
            background: var(--glass-2);
            border: 1px solid var(--glass-border);
        }
        .group-title .rule {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--glass-border), transparent);
        }

        /* ============================================================
           STATUS CARDS
           ============================================================ */
        .status-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            margin-bottom: 12px;
            border-radius: 18px;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 24px -14px rgba(0, 0, 0, 0.4);
        }
        .status-card:hover {
            border-color: var(--sky);
            transform: translateX(4px);
            box-shadow: 0 8px 28px -14px rgba(79, 179, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .status-card .info .name {
            font-weight: 600;
            font-size: 1.02rem;
            color: var(--ink);
        }
        .status-card .info .detail {
            font-size: 0.78rem;
            color: var(--ink-mute);
            margin-top: 2px;
            display: block;
            font-family: monospace;
            letter-spacing: .3px;
        }
        .status-badge {
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .status-badge.online {
            background: rgba(0, 255, 136, 0.18);
            color: #7dffb5;
            border: 1px solid rgba(0, 255, 136, 0.25);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.08);
        }
        .status-badge.offline {
            background: rgba(255, 77, 77, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 77, 77, 0.2);
        }
        .status-badge.checking {
            background: rgba(255, 255, 255, 0.06);
            color: var(--ink-mute);
            border: 1px solid var(--glass-border);
        }
        .status-badge .pulse-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .status-badge.online .pulse-dot {
            background: #7dffb5;
            box-shadow: 0 0 8px #7dffb5;
            animation: pulse-online 1.6s ease-in-out infinite;
        }
        .status-badge.offline .pulse-dot {
            background: #ff6b6b;
            box-shadow: 0 0 8px #ff6b6b;
        }
        .status-badge.checking .pulse-dot {
            background: var(--ink-mute);
            animation: pulse-check 1.2s ease-in-out infinite;
        }
        @keyframes pulse-online {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: .3;
            }
        }
        @keyframes pulse-check {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: .2;
            }
        }

        /* ============================================================
           COPY TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(4, 16, 31, 0.92);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 28px;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(79, 179, 255, 0.08);
            color: var(--ink);
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease, transform 0.4s ease;
            min-width: 220px;
            justify-content: center;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .toast .toast-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .toast .toast-msg {
            flex: 1;
        }
        .toast .toast-close {
            background: none;
            border: none;
            color: var(--ink-mute);
            font-size: 1.2rem;
            cursor: pointer;
            pointer-events: auto;
            transition: color 0.2s;
            padding: 0 4px;
        }
        .toast .toast-close:hover {
            color: var(--ink);
        }
        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--sky), var(--ice));
            width: 100%;
            border-radius: 0 0 16px 16px;
            animation: shrink 3s linear forwards;
        }
        @keyframes shrink {
            from {
                width: 100%;
            }
            to {
                width: 0%;
            }
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            margin-top: 48px;
            padding-top: 20px;
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .wave-strip {
            height: 16px;
            width: 100%;
            margin-bottom: 16px;
            background: linear-gradient(90deg, transparent, var(--core), var(--sky), var(--ice), var(--sky), var(--core), transparent);
            opacity: .5;
            border-radius: 999px;
            filter: blur(1px);
        }
        .f-left {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            font-size: .85rem;
            color: var(--ink-mute);
        }
        .f-left .heart {
            color: var(--ice);
            animation: heartbeat 1.6s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.25);
            }
        }
        .f-left .ver {
            background: var(--glass-2);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            padding: 3px 12px;
            font-size: .75rem;
            color: var(--ice);
        }
        .f-right {
            display: flex;
            gap: 10px;
        }
        .f-right a {
            color: var(--ink-mute);
            text-decoration: none;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-2);
            border: 1px solid var(--glass-border);
            transition: .2s;
        }
        .f-right a:hover {
            color: #04162c;
            background: linear-gradient(135deg, var(--sky), var(--core));
            transform: translateY(-2px);
        }

        /* ============================================================
           MOBILE HOTBAR
           ============================================================ */
        .mobile-hotbar {
            display: none;
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: 12px;
            z-index: 50;
            border-radius: 22px;
            padding: 8px 10px;
            gap: 6px;
            justify-content: space-around;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .mobile-hotbar a {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--ink-mute);
            text-decoration: none;
            font-size: .62rem;
            padding: 6px 2px;
            border-radius: 14px;
            font-weight: 500;
            transition: .2s;
        }
        .mobile-hotbar a i {
            font-size: 1rem;
        }
        .mobile-hotbar a:active,
        .mobile-hotbar a.active-link {
            background: var(--glass-2);
            color: var(--ice);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 860px) {
            .quick-links {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 720px) {
            body {
                padding: 14px 12px 80px;
            }
            .dock {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-links {
                display: none;
            }
            .brand {
                justify-content: center;
            }
            .page-title h1 {
                font-size: 2.0rem;
            }
            .quick-links {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .quick-card {
                min-height: 90px;
                padding: 16px 10px 14px;
            }
            .quick-card .icon {
                font-size: 1.8rem;
            }
            .status-card {
                flex-wrap: wrap;
                gap: 10px;
                padding: 14px 18px;
            }
            .status-card .info .name {
                font-size: .95rem;
            }
            .mobile-hotbar {
                display: flex;
            }
            .footer {
                justify-content: center;
                text-align: center;
            }
        }
        @media (max-width: 420px) {
            .page-title h1 {
                font-size: 1.6rem;
            }
            .quick-links {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .quick-card {
                min-height: 76px;
                padding: 12px 8px 10px;
            }
            .quick-card .icon {
                font-size: 1.5rem;
            }
            .quick-card .label {
                font-size: .72rem;
            }
            .status-card {
                padding: 12px 14px;
            }
            .status-badge {
                font-size: .6rem;
                padding: 4px 12px;
            }
            .toast {
                min-width: 160px;
                padding: 12px 16px;
                font-size: .85rem;
                bottom: 76px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .blob,
            .bubble,
            .glass::after,
            .status-badge.online .pulse-dot,
            .f-left .heart {
                animation: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Backdrop -->
    <div class="abyss"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="bubbles" id="bubbleField"></div>

    <div class="container">

        <!-- NAV -->
        <nav class="dock glass">
            <a href="https://maynat.ct.ws" class="brand">
                <div class="slot"><i class="fas fa-water"></i></div>
                <div class="txt">
                    <span class="name">MAYNAT</span>
                    <span class="sub">status</span>
                </div>
            </a>
            <div class="nav-links">
                <a href="https://maynat.ct.ws">Home</a>
                <a href="https://discord.maynat.eu" class="primary" target="_blank"><i class="fab fa-discord"></i>Discord</a>
            </div>
        </nav>

        <!-- TITLE -->
        <div class="page-title">
            <h1>Stare <span class="accent">·</span> Network</h1>
            <p>Monitorizare live pentru toate serviciile Maynat</p>
        </div>

        <!-- QUICK LINKS -->
        <div class="quick-links" id="quickLinks">
            <!-- generate via JS din config -->
        </div>

        <!-- STATUS GROUPS -->
        <div id="statusGroups">
            <!-- generate via JS din config -->
        </div>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="wave-strip"></div>
            <div class="f-left">
                <span>© 2026 maynat.eu</span><span>·</span>
                <span>făcut cu <span class="heart">♥</span> pentru comunitate</span><span>·</span>
                <span class="ver">status · v2.0</span>
            </div>
            <div class="f-right">
                <a href="https://discord.maynat.eu" target="_blank"><i class="fab fa-discord"></i></a>
                <a href="https://www.tiktok.com/@maynat.ct.ws" target="_blank"><i class="fab fa-tiktok"></i></a>
                <a href="https://maynat.ct.ws" target="_blank"><i class="fas fa-globe"></i></a>
            </div>
        </footer>

    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <span class="toast-icon" id="toastIcon">✅</span>
        <span class="toast-msg" id="toastMsg">Copiat!</span>
        <button class="toast-close" id="toastClose">&times;</button>
        <div class="toast-progress" id="toastProgress"></div>
    </div>

    <!-- MOBILE HOTBAR -->
    <nav class="mobile-hotbar" id="mobileHotbar">
        <!-- generat din JS -->
    </nav>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. BUBBLES
            // ============================================================
            const bubbleField = document.getElementById('bubbleField');
            for (let i = 0; i < 14; i++) {
                const b = document.createElement('div');
                b.className = 'bubble';
                const size = 6 + Math.random() * 20;
                b.style.width = size + 'px';
                b.style.height = size + 'px';
                b.style.left = Math.random() * 100 + '%';
                const dur = 10 + Math.random() * 14;
                b.style.animationDuration = dur + 's';
                b.style.animationDelay = (-Math.random() * dur) + 's';
                bubbleField.appendChild(b);
            }

            // ============================================================
            // 2. CONFIG — încărcat din fișier extern
            //    ⚠️  IP-urile și datele sensibile sunt într-un fișier JSON
            //        separat, NU în HTML. Astfel, la F12 nu se văd în sursă.
            // ============================================================
            let CONFIG = null;

            async function loadConfig() {
                try {
                    // Încearcă să încarce din config.json (sau poți schimba cu un endpoint PHP)
                    const res = await fetch('config.json?' + Date.now());
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    CONFIG = await res.json();
                } catch (e) {
                    console.warn('Nu s-a putut încărca config.json, folosesc fallback local.', e);
                    // Fallback — doar pentru demo, în producție NU pune IP-uri aici!
                    CONFIG = {
                        quickLinks: [
                            { icon: '⛏️', label: 'Server IP', sub: 'maynat.eu', action: 'copy', value: 'maynat.eu' },
                            { icon: '💬', label: 'Discord', sub: 'Comunitate', url: 'https://discord.maynat.eu' },
                            { icon: '🎵', label: 'TikTok', sub: '@maynat.ct.ws', url: 'https://tiktok.com/@maynat.ct.ws' },
                            { icon: '🛒', label: 'Magazin', sub: 'Store', url: 'https://store.maynat.eu' }
                        ],
                        groups: [{
                            name: 'SERVERE MINECRAFT',
                            items: [
                                { name: 'Server Principal', detail: 'maynat.eu', ip: 'maynat.eu' }
                            ]
                        }, {
                            name: 'SERVICII WEB',
                            items: [
                                { name: 'Website', detail: 'maynat.ct.ws', url: 'https://maynat.ct.ws' },
                                { name: 'Hosting', detail: 'maynathosting.ct.ws', url: 'https://maynathosting.ct.ws' },
                                { name: 'Discord', detail: 'discord.maynat.eu', url: 'https://discord.maynat.eu' },
                                { name: 'Magazin', detail: 'store.maynat.eu', url: 'https://store.maynat.eu' }
                            ]
                        }],
                        mobileHotbar: [
                            { icon: 'fa-home', label: 'Home', url: 'https://maynat.ct.ws' },
                            { icon: 'fa-copy', label: 'Copiază IP', action: 'copy' },
                            { icon: 'fa-discord', label: 'Discord', url: 'https://discord.maynat.eu' },
                            { icon: 'fa-store', label: 'Magazin', url: 'https://store.maynat.eu' }
                        ]
                    };
                }
                renderAll();
            }

            // ============================================================
            // 3. RENDER
            // ============================================================
            function renderAll() {
                if (!CONFIG) return;
                renderQuickLinks();
                renderGroups();
                renderMobileHotbar();
                // După randare, pornește verificările de status
                checkAllStatuses();
            }

            // ---------- Quick Links ----------
            function renderQuickLinks() {
                const container = document.getElementById('quickLinks');
                container.innerHTML = '';
                CONFIG.quickLinks.forEach(item => {
                    const a = document.createElement('a');
                    a.className = 'quick-card glass';

                    if (item.action === 'copy') {
                        a.href = '#';
                        a.addEventListener('click', function(e) {
                            e.preventDefault();
                            copyToClipboard(item.value || item.label, item.label + ' copiat!');
                        });
                    } else if (item.url) {
                        a.href = item.url;
                        a.target = '_blank';
                    } else {
                        a.href = '#';
                    }

                    a.innerHTML = `
                        <span class="icon">${item.icon}</span>
                        <span class="label">${item.label}</span>
                        ${item.sub ? `<span class="sub-label">${item.sub}</span>` : ''}
                    `;
                    container.appendChild(a);
                });
            }

            // ---------- Groups ----------
            function renderGroups() {
                const container = document.getElementById('statusGroups');
                container.innerHTML = '';
                CONFIG.groups.forEach((group, gi) => {
                    const wrapper = document.createElement('div');

                    // Title
                    const title = document.createElement('div');
                    title.className = 'group-title';
                    title.innerHTML = `
                        <span class="tag">${group.name}</span>
                        <span class="rule"></span>
                    `;
                    wrapper.appendChild(title);

                    // Items
                    group.items.forEach((item, ii) => {
                        const card = document.createElement('div');
                        card.className = 'status-card glass';
                        const id = 'status-' + gi + '-' + ii;
                        card.id = id;

                        let detailText = item.detail || item.ip || item.url || '';
                        card.innerHTML = `
                            <div class="info">
                                <div class="name">${item.name}</div>
                                <span class="detail">${detailText}</span>
                            </div>
                            <div class="status-badge checking" id="${id}-badge">
                                <span class="pulse-dot"></span> Se verifică...
                            </div>
                        `;
                        wrapper.appendChild(card);

                        // Stocăm datele pentru verificare
                        card._statusData = {
                            type: item.ip ? 'minecraft' : 'web',
                            ip: item.ip || null,
                            url: item.url || null,
                            badgeId: id + '-badge'
                        };
                    });

                    container.appendChild(wrapper);
                });
            }

            // ---------- Mobile Hotbar ----------
            function renderMobileHotbar() {
                const bar = document.getElementById('mobileHotbar');
                bar.innerHTML = '';
                CONFIG.mobileHotbar.forEach(item => {
                    const a = document.createElement('a');
                    if (item.action === 'copy') {
                        a.href = '#';
                        a.addEventListener('click', function(e) {
                            e.preventDefault();
                            const ip = CONFIG.quickLinks.find(q => q.action === 'copy');
                            if (ip) copyToClipboard(ip.value || ip.label, ip.label + ' copiat!');
                        });
                    } else if (item.url) {
                        a.href = item.url;
                        a.target = '_blank';
                    } else {
                        a.href = '#';
                    }
                    a.innerHTML = `<i class="fas ${item.icon}"></i>${item.label}`;
                    bar.appendChild(a);
                });
            }

            // ============================================================
            // 4. STATUS CHECK
            // ============================================================
            async function checkAllStatuses() {
                const cards = document.querySelectorAll('.status-card');
                for (const card of cards) {
                    const data = card._statusData;
                    if (!data) continue;
                    const badge = document.getElementById(data.badgeId);
                    if (!badge) continue;

                    try {
                        if (data.type === 'minecraft' && data.ip) {
                            await checkMinecraft(data.ip, badge);
                        } else if (data.type === 'web' && data.url) {
                            await checkWeb(data.url, badge);
                        } else {
                            badge.className = 'status-badge offline';
                            badge.innerHTML = `<span class="pulse-dot"></span> Necunoscut`;
                        }
                    } catch (e) {
                        badge.className = 'status-badge offline';
                        badge.innerHTML = `<span class="pulse-dot"></span> Eroare`;
                    }
                }
            }

            async function checkMinecraft(ip, badge) {
                try {
                    const res = await fetch(`https://api.mcsrvstat.us/2/${ip}`);
                    if (!res.ok) throw new Error('API error');
                    const data = await res.json();
                    if (data.online) {
                        badge.className = 'status-badge online';
                        const players = data.players ? data.players.online : '?';
                        badge.innerHTML = `<span class="pulse-dot"></span> Online · ${players} jucători`;
                    } else {
                        badge.className = 'status-badge offline';
                        badge.innerHTML = `<span class="pulse-dot"></span> Offline`;
                    }
                } catch {
                    badge.className = 'status-badge offline';
                    badge.innerHTML = `<span class="pulse-dot"></span> Indisponibil`;
                }
            }

            async function checkWeb(url, badge) {
                try {
                    // Folosim HEAD pentru a verifica rapid
                    const res = await fetch(url, { method: 'HEAD', mode: 'no-cors' });
                    // no-cors returnează opaque, nu putem citi status, dar requestul ajunge
                    // Considerăm online dacă nu aruncă excepție.
                    badge.className = 'status-badge online';
                    badge.innerHTML = `<span class="pulse-dot"></span> Online`;
                } catch {
                    // Dacă fetch aruncă (CORS, etc), încercăm cu un proxy sau fallback
                    // Pentru simplitate, încercăm un GET cu timeout
                    try {
                        const ctrl = new AbortController();
                        const timeout = setTimeout(() => ctrl.abort(), 4000);
                        const res = await fetch(url, { signal: ctrl.signal });
                        clearTimeout(timeout);
                        badge.className = 'status-badge online';
                        badge.innerHTML = `<span class="pulse-dot"></span> Online`;
                    } catch {
                        badge.className = 'status-badge offline';
                        badge.innerHTML = `<span class="pulse-dot"></span> Offline`;
                    }
                }
            }

            // ============================================================
            // 5. COPY
            // ============================================================
            function copyToClipboard(text, successMsg) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(successMsg || 'Copiat!', '📋');
                }).catch(() => {
                    // Fallback
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        document.execCommand('copy');
                        showToast(successMsg || 'Copiat!', '📋');
                    } catch {
                        showToast('Nu s-a putut copia.', '❌');
                    }
                    document.body.removeChild(ta);
                });
            }

            // ============================================================
            // 6. TOAST
            // ============================================================
            let toastTimeout = null;

            function showToast(msg, icon) {
                const toast = document.getElementById('toast');
                const iconEl = document.getElementById('toastIcon');
                const msgEl = document.getElementById('toastMsg');
                const progress = document.getElementById('toastProgress');

                iconEl.textContent = icon || '✅';
                msgEl.textContent = msg;

                // Reset progress
                progress.style.animation = 'none';
                void progress.offsetWidth;
                progress.style.animation = 'shrink 3s linear forwards';

                toast.classList.add('show');

                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            document.getElementById('toastClose').addEventListener('click', function() {
                const toast = document.getElementById('toast');
                toast.classList.remove('show');
                if (toastTimeout) clearTimeout(toastTimeout);
            });

            // ============================================================
            // 7. SMOOTH SCROLL (dacă există anchor)
            // ============================================================
            document.querySelectorAll('a[href^="#"]').forEach(a => {
                a.addEventListener('click', function(e) {
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        e.preventDefault();
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            });

            // ============================================================
            // 8. START
            // ============================================================
            loadConfig();

            // Re-check la intervale
            setInterval(() => {
                if (CONFIG) checkAllStatuses();
            }, 45000);

            console.log('🌊 MAYNAT · Status — config încărcat din fișier extern (IP-uri ascunse în sursă)');
            console.log('ℹ️  Dacă vrei să folosești .env, creează un endpoint PHP care citește .env și returnează JSON.');

        })();
    </script>

</body>
</html>
